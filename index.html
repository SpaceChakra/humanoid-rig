<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Humanoid Rig — Character Editor (SpaceChakra)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070a12'/%3E%3Ctext x='16' y='23' font-size='22' text-anchor='middle' fill='%2335c8ff' font-family='Arial' font-weight='bold' font-style='italic'%3EH%3C/text%3E%3C/svg%3E">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<style>
  :root { --bg:#0a0d15; --panel:#131826; --panel2:#1b2234; --line:#2a3350; --text:#dce4f5; --dim:#8b97b5; --accent:#35c8ff; --red:#ff5a3c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif; overflow:hidden; }
  #app { display:flex; height:100vh; }
  #view { flex:1; position:relative; min-width:0; }
  #view canvas { display:block; width:100%; height:100%; }
  #viewhint { position:absolute; left:14px; bottom:12px; color:var(--dim); font-size:12px;
    letter-spacing:.02em; pointer-events:none; text-shadow:0 1px 3px #000; }
  #title { position:absolute; left:16px; top:14px; font-weight:800; font-style:italic;
    letter-spacing:.06em; font-size:20px; text-shadow:0 2px 6px #000; }
  #title span { color:var(--accent); }
  #panel { width:340px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; height:100%; }
  #panel header { padding:12px 14px; border-bottom:1px solid var(--line); }
  #panel header h1 { margin:0 0 8px; font-size:13px; letter-spacing:.14em; color:var(--dim); font-weight:700; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; }
  button.preset { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; font-size:12px; cursor:pointer; letter-spacing:.03em; }
  button.preset:hover { border-color:var(--accent); color:#fff; }
  button.preset.red:hover { border-color:var(--red); }
  #controls { overflow-y:auto; padding:10px 14px 20px; flex:1; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 0; }
  .row label { font-size:13px; color:var(--text); }
  .row .sub { color:var(--dim); font-size:11px; }
  .group-title { margin:14px 0 4px; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); border-bottom:1px solid var(--line); padding-bottom:4px; }
  input[type=color] { width:40px; height:24px; border:1px solid var(--line); border-radius:4px;
    background:none; padding:0; cursor:pointer; }
  input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
  select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:5px;
    padding:3px 6px; font-size:12px; }
  .ctl { display:flex; align-items:center; gap:8px; }
  #io { border-top:1px solid var(--line); padding:10px 14px; }
  #io textarea { width:100%; height:78px; resize:vertical; background:#080b12; color:var(--dim);
    border:1px solid var(--line); border-radius:6px; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px; padding:6px; }
  #io .btns { display:flex; gap:6px; margin-top:6px; }
  #io button { flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px; font-size:12px; cursor:pointer; }
  #io button:hover { border-color:var(--accent); }
  a.back { color:var(--dim); font-size:12px; text-decoration:none; }
  a.back:hover { color:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="title">HUMANOID <span>RIG</span> · CHARACTER EDITOR</div>
    <div id="viewhint">drag to rotate · scroll to zoom · pose dropdown previews the shared animation player</div>
  </div>
  <div id="panel">
    <header>
      <h1>PRESETS</h1>
      <div class="presets" id="presets"></div>
      <div style="margin-top:8px">from <a class="back" href="https://patreon.com/spacechakra" target="_blank" rel="noopener">SpaceChakra</a> · MIT</div>
    </header>
    <div id="controls"></div>
    <div id="io">
      <textarea id="json" spellcheck="false"></textarea>
      <div class="btns">
        <button id="copyBtn">COPY JSON</button>
        <button id="applyBtn">APPLY JSON</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="editor.js"></script>
</body>
</html>
